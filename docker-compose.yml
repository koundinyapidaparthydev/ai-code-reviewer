services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_code_reviewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_code_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./ai-code-reviewer-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://ai:ai@postgres:5432/ai_code_reviewer?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-demo-jwt-secret-change-me-please
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      REVIEW_MODE: tools
      EVAL_FIXTURES_PATH: /app/fixtures/eval
      EVAL_REPORT_PATH: /app/eval/last-report.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4-turbo-preview
      UPLOAD_DIR: ./uploads
    volumes:
      - ./fixtures/eval:/app/fixtures/eval:ro
      - ./ai-code-reviewer-backend/eval:/app/eval
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./ai-code-reviewer-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_WS_URL: http://localhost:5000
    depends_on:
      - api

volumes:
  pgdata:
